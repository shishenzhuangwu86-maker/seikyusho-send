<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>請求書 名簿チェック</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --ng:#dc2626; --warn:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; font-size:15px; line-height:1.6; }
  .wrap { max-width:900px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } }
  .drop { display:block; border:2px dashed #c7d2fe; border-radius:12px; padding:18px 14px; text-align:center; background:#f8faff; cursor:pointer; }
  .drop.over { background:#e0e7ff; border-color:var(--accent); }
  .drop strong { display:block; font-size:15px; margin-bottom:4px; }
  .drop span { color:var(--muted); font-size:12px; }
  input[type=file] { display:none; }
  ul.files { list-style:none; padding:0; margin:10px 0 0; font-size:13px; max-height:30vh; overflow:auto; }
  ul.files li { padding:4px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; }
  ul.files li:first-child { border-top:0; }
  ul.files .d { color:var(--muted); white-space:nowrap; }
  .btn { width:100%; padding:14px; font-size:17px; font-weight:700; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  .btn:disabled { background:#9ca3af; cursor:not-allowed; }
  .btn2 { padding:8px 14px; font-size:13px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; margin-right:6px; }
  .totals { display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 12px; }
  .tot { flex:1; min-width:150px; background:#f8faff; border:1px solid #e0e7ff; border-radius:10px; padding:10px 12px; }
  .tot .k { color:var(--muted); font-size:12px; } .tot .v { font-size:20px; font-weight:700; } .tot .s { font-size:12px; color:var(--muted); }
  .tot.ok { border-color:#bbf7d0; background:#f0fdf4; } .tot.ng { border-color:#fecaca; background:#fef2f2; }
  h2 { font-size:16px; margin:18px 0 6px; display:flex; align-items:center; gap:8px; }
  .badge { font-size:12px; padding:1px 10px; border-radius:999px; color:#fff; background:var(--muted); }
  .badge.ng { background:var(--ng); } .badge.warn { background:var(--warn); } .badge.ok { background:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:6px 6px; border-top:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:normal; border-top:0; background:#fafafa; }
  td.n, th.n { text-align:right; white-space:nowrap; }
  td.c { text-align:center; }
  tr.ng td { background:#fff1f2; } tr.warn td { background:#fffbeb; }
  .small { color:var(--muted); font-size:12px; }
  .ok { color:var(--ok); } .ng { color:var(--ng); } .warn { color:var(--warn); }
  details summary { cursor:pointer; color:var(--accent); font-size:13px; }
  #result { display:none; }
  @media print { .noprint { display:none; } body { background:#fff; } .card { border:0; padding:0; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>請求書 名簿チェック</h1>
  <p class="sub">カイポケの「お客様負担金額集計一覧」と、送る請求書Excel（国保・社保）を突き合わせて、漏れ・重複・金額の違いを確認します。ファイルはこのブラウザの中だけで読み取り、どこにも送信しません。</p>

  <div class="grid noprint">
    <div class="card">
      <label class="drop" id="dropR" for="fileR"><strong>① 名簿（お客様負担金額集計一覧）</strong><span>.xls / .xlsx を1つ。カイポケから出力したもの</span></label>
      <input type="file" id="fileR" accept=".xls,.xlsx">
      <ul class="files" id="listR"></ul>
    </div>
    <div class="card">
      <label class="drop" id="dropI" for="fileI"><strong>② 請求書Excel（国保・社保）</strong><span>.xls / .xlsx を何件でも。送信画面に入れるのと同じファイル</span></label>
      <input type="file" id="fileI" multiple accept=".xls,.xlsx">
      <ul class="files" id="listI"></ul>
    </div>
  </div>
  <div class="card noprint">
    <button class="btn" id="run" disabled>チェックする</button>
    <p class="small" id="msg" style="margin:8px 0 0"></p>
  </div>

  <div class="card" id="result"></div>
  <p class="small">名前の照合: 空白と全角半角の違い、異体字（髙/高、﨑/崎、齋/斎 など）は同じとみなします。姓か名の一方だけ違う人は「表記ゆれの可能性」として別枠に出します。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var roster = null, invoices = [];
  var XLSX = (typeof window !== 'undefined' && window.XLSX) || (typeof require === 'function' ? require('xlsx') : null);

  // ---------- 名前の正規化 ----------
  var VAR = { '髙':'高', '﨑':'崎', '嵜':'崎', '齋':'斎', '齊':'斉', '邊':'辺', '邉':'辺', '國':'国', '澤':'沢', '濱':'浜', '廣':'広', '櫻':'桜', '藝':'芸', '栁':'柳', '瀨':'瀬', '槇':'槙', '眞':'真', '黑':'黒', '德':'徳', '惠':'恵', '彌':'弥', '壽':'寿', '條':'条', '萬':'万', '與':'与', '曾':'曽', '舘':'館' };
  function normName(s) {
    s = String(s == null ? '' : s).normalize('NFKC').replace(/[\s　]+/g, '');
    return s.split('').map(function (c) { return VAR[c] || c; }).join('');
  }
  function splitName(s) { // 「姓　名」の形なら [姓, 名]
    var t = String(s == null ? '' : s).normalize('NFKC').trim().split(/[\s　]+/);
    return t.length >= 2 ? [normName(t[0]), normName(t.slice(1).join(''))] : [normName(s), ''];
  }
  function lev(a, b) {
    var m = a.length, n = b.length, d = [];
    for (var i = 0; i <= m; i++) { d[i] = [i]; }
    for (var j = 1; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[m][n];
  }
  function yen(n) { return n == null ? '—' : '¥' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function norm(x) { return String(x == null ? '' : x).normalize('NFKC').replace(/[\s　]+/g, ''); }
  function num(x) { if (typeof x === 'number') return x; var t = String(x == null ? '' : x).replace(/[,，円\s　]/g, ''); return t !== '' && !isNaN(Number(t)) ? Number(t) : null; }

  // ---------- Excel 読み込み ----------
  function readWorkbook(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { try { res(XLSX.read(new Uint8Array(r.result), { type: 'array', cellDates: false })); } catch (e) { rej(new Error(file.name + ' を読めませんでした: ' + e.message)); } };
      r.onerror = function () { rej(new Error(file.name + ' を読めませんでした')); };
      r.readAsArrayBuffer(file);
    });
  }
  function sheetRows(ws) { return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }); }

  // 名簿: 「お客様名」「請求金額計」の見出し行を探して、その下を読む
  function parseRoster(wb) {
    var ws = wb.Sheets[wb.SheetNames[0]], rows = sheetRows(ws);
    var hdr = -1, cName = -1, cAmt = -1, cNo = -1, cKana = -1;
    for (var r = 0; r < rows.length && hdr < 0; r++) {
      var cells = rows[r].map(norm);
      var i = cells.indexOf('お客様名'), j = cells.indexOf('請求金額計');
      if (i >= 0 && j >= 0) { hdr = r; cName = i; cAmt = j; cNo = cells.indexOf('項番'); cKana = cells.indexOf('フリガナ'); }
    }
    if (hdr < 0) throw new Error('名簿の見出し行(「お客様名」「請求金額計」)が見つかりません。カイポケの「お客様負担金額集計一覧」を選んでください。');
    var out = [];
    for (r = hdr + 1; r < rows.length; r++) {
      var nm = rows[r][cName];
      if (nm == null || String(nm).trim() === '' || norm(nm) === '合計') continue;
      out.push({ no: cNo >= 0 ? rows[r][cNo] : out.length + 1, name: String(nm).trim(), key: normName(nm), parts: splitName(nm), kana: cKana >= 0 ? rows[r][cKana] : '', amount: num(rows[r][cAmt]) });
    }
    return out;
  }

  // 請求書シート(1枚目)の集計(送信画面と同じロジック): 小計/合計行を除外、公費の表は「公費単独」のみ
  function extractSummary(values) {
    var cCount = -1, cAmount = -1, pubTable = false, pubSolo = false, found = false, people = 0, amount = 0, label = '';
    for (var r = 0; r < values.length; r++) {
      var row = values[r], cells = row.map(norm).filter(function (x) { return x !== ''; });
      if (!cells.length) continue;
      var hc = -1, ha = -1;
      for (var c = 0; c < row.length; c++) { if (norm(row[c]) === '件数') hc = c; if (hc >= 0 && c > hc && norm(row[c]) === '金額') { ha = c; break; } }
      if (hc >= 0 && ha >= 0) { cCount = hc; cAmount = ha; found = true; pubTable = /公費/.test(label) || /公費/.test(cells.join('|')); pubSolo = false; label = ''; continue; }
      if (cCount < 0) { if (cells.length <= 2) label = cells.join('|'); continue; }
      var rowLabel = row.slice(0, cCount).map(norm).join('');
      if (pubTable) { if (/単独/.test(rowLabel)) pubSolo = true; else if (/併用/.test(rowLabel)) pubSolo = false; }
      if (cells.length <= 2) { label = cells.join('|'); continue; }
      if (pubTable && !pubSolo) continue;
      if (/小計|合計|総件数/.test(rowLabel)) continue;
      var p = num(row[cCount]), a = num(row[cAmount]);
      if (p == null) continue;
      people += p; if (a != null) amount += a;
    }
    return { found: found, people: people, amount: amount };
  }

  // 明細書シート(1人分): 「請求」列の 保険 行の額(無ければ 公① 〜 公④ の行)
  function personAmount(rows) {
    var col = -1, hdrRow = -1;
    for (var r = 0; r < Math.min(rows.length, 12) && col < 0; r++) for (var c = 0; c < rows[r].length; c++) if (norm(rows[r][c]) === '請求') { col = c; hdrRow = r; break; }
    if (col < 0) return { amount: null, how: '「請求」列なし' };
    var pub = null;
    for (r = hdrRow + 1; r < Math.min(rows.length, hdrRow + 14); r++) {
      var lbl = rows[r].map(norm).filter(Boolean)[0] || '';
      var v = num(rows[r][col]);
      if (/^保険/.test(lbl) && v != null) return { amount: v, how: '保険' };
      if (/^公/.test(lbl) && v != null && pub == null) pub = { amount: v, how: lbl };
    }
    return pub || { amount: null, how: '額なし' };
  }

  function parseInvoice(file, wb) {
    var kind = /社保|社会保険/.test(file.name) ? '社保' : '国保';
    var first = wb.SheetNames[0];
    var summary = extractSummary(sheetRows(wb.Sheets[first]));
    var persons = [];
    wb.SheetNames.slice(1).forEach(function (sn) {
      if (/請求書|集計|^Sheet\d*$|^シート\d*$/.test(sn)) return;
      var pa = personAmount(sheetRows(wb.Sheets[sn]));
      persons.push({ name: sn.trim(), key: normName(sn), parts: splitName(sn), amount: pa.amount, how: pa.how, file: file.name, kind: kind });
    });
    return { file: file.name, kind: kind, summary: summary, persons: persons };
  }

  // ---------- 突き合わせ(純粋関数: 名簿 R と 請求書の人 P) ----------
  function reconcile(R, P) {
    // 請求書側の重複(同じ名前が2回)
    var seen = {}, dups = [];
    P.forEach(function (p) { if (seen[p.key]) dups.push({ a: seen[p.key], b: p }); else seen[p.key] = p; });

    // 1. 完全一致
    var byKey = {}; P.forEach(function (p) { if (!byKey[p.key]) byKey[p.key] = p; });
    var usedP = {}, rowsOut = [], fuzzy = [], missing = [];
    R.forEach(function (r) {
      var p = byKey[r.key];
      if (p && !usedP[p.key]) { usedP[p.key] = true; rowsOut.push({ r: r, p: p, how: '一致' }); }
      else rowsOut.push({ r: r, p: null, how: '' });
    });
    // 2. 表記ゆれ: 候補の組を点数順(確からしい順)に並べて割り当てる
    //    1点=姓か名の一方が一致し、もう一方が1文字違い以内 / 全体で1文字違い、2点=名だけ一致(改姓・通名など)
    var cands = [];
    rowsOut.forEach(function (o, oi) {
      if (o.p) return;
      P.forEach(function (p) {
        if (usedP[p.key]) return;
        var s = 99, rs = o.r.parts, ps = p.parts;
        if (rs[1] && ps[1]) {
          if (rs[0] === ps[0] && lev(rs[1], ps[1]) <= 1) s = 1;
          else if (rs[1] === ps[1] && lev(rs[0], ps[0]) <= 1) s = 1;
          else if (rs[1] === ps[1]) s = 2;
        }
        if (lev(o.r.key, p.key) <= 1) s = Math.min(s, 1);
        if (s <= 2) cands.push({ oi: oi, p: p, s: s });
      });
    });
    cands.sort(function (a, b) { return a.s - b.s || a.oi - b.oi; });
    cands.forEach(function (c) {
      var o = rowsOut[c.oi];
      if (o.p || usedP[c.p.key]) return;
      usedP[c.p.key] = true; o.p = c.p; o.how = '表記ゆれ'; fuzzy.push(o);
    });
    rowsOut.forEach(function (o) { if (!o.p) missing.push(o.r); });
    var extra = P.filter(function (p) { return !usedP[p.key]; });
    var amtDiff = rowsOut.filter(function (o) { return o.p && o.r.amount != null && o.p.amount != null && Math.abs(o.r.amount - o.p.amount) > 20; });
    var amtUnknown = rowsOut.filter(function (o) { return o.p && o.p.amount == null; });
    return { rowsOut: rowsOut, fuzzy: fuzzy, missing: missing, extra: extra, dups: dups, amtDiff: amtDiff, amtUnknown: amtUnknown, seen: seen };
  }
  if (typeof module !== 'undefined') module.exports = { normName: normName, splitName: splitName, lev: lev, parseRoster: parseRoster, extractSummary: extractSummary, personAmount: personAmount, parseInvoice: parseInvoice, reconcile: reconcile };
  if (typeof document === 'undefined') return;

  // ---------- 画面 ----------
  function render() {
    $('listR').innerHTML = roster ? '<li><span>' + esc(roster.file.name) + '</span><span class="d">' + roster.rows.length + '人 / ' + yen(roster.rows.reduce(function (a, x) { return a + (x.amount || 0); }, 0)) + '</span></li>' : '';
    $('listI').innerHTML = invoices.map(function (iv, i) { return '<li><span>' + esc(iv.file) + '</span><span class="d">' + iv.kind + ' ' + iv.persons.length + '人 / ' + yen(iv.persons.reduce(function (a, x) { return a + (x.amount || 0); }, 0)) + ' <a href="#" data-i="' + i + '" class="rm">×</a></span></li>'; }).join('');
    $('run').disabled = !(roster && invoices.length);
  }
  $('listI').addEventListener('click', function (e) { var a = e.target.closest('a.rm'); if (!a) return; e.preventDefault(); invoices.splice(+a.dataset.i, 1); render(); });

  async function addRoster(files) {
    if (!files.length) return;
    try { var wb = await readWorkbook(files[0]); roster = { file: files[0], rows: parseRoster(wb) }; $('msg').textContent = ''; }
    catch (e) { $('msg').innerHTML = '<span class="ng">' + esc(e.message) + '</span>'; }
    render();
  }
  async function addInvoices(files) {
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!/\.(xlsx|xls)$/i.test(f.name)) continue;
      if (invoices.some(function (x) { return x.file === f.name; })) continue;
      try { invoices.push(parseInvoice(f, await readWorkbook(f))); } catch (e) { $('msg').innerHTML = '<span class="ng">' + esc(e.message) + '</span>'; }
    }
    invoices.sort(function (a, b) { return a.kind === b.kind ? a.file.localeCompare(b.file, 'ja') : (a.kind === '国保' ? -1 : 1); });
    render();
  }
  [['dropR', 'fileR', addRoster], ['dropI', 'fileI', addInvoices]].forEach(function (x) {
    var drop = $(x[0]), input = $(x[1]), fn = x[2];
    input.addEventListener('change', function () { fn(input.files); input.value = ''; });
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { fn(e.dataTransfer.files); });
  });

  function check() {
    var R = roster.rows, P = [];
    invoices.forEach(function (iv) { iv.persons.forEach(function (p) { P.push(p); }); });
    var rc = reconcile(R, P);
    var rowsOut = rc.rowsOut, fuzzy = rc.fuzzy, missing = rc.missing, extra = rc.extra, dups = rc.dups, amtDiff = rc.amtDiff, amtUnknown = rc.amtUnknown, seen = rc.seen;

    // 集計
    var sumR = R.reduce(function (a, x) { return a + (x.amount || 0); }, 0);
    var byKind = {};
    invoices.forEach(function (iv) {
      var k = byKind[iv.kind] = byKind[iv.kind] || { files: 0, people: 0, amount: 0, formAmount: 0 };
      k.files++; k.people += iv.persons.length; k.amount += iv.persons.reduce(function (a, x) { return a + (x.amount || 0); }, 0); k.formAmount += iv.summary.amount;
    });
    var sumP = P.reduce(function (a, x) { return a + (x.amount || 0); }, 0);
    var nUniqueP = Object.keys(seen).length;
    var okAll = missing.length === 0 && extra.length === 0 && amtDiff.length === 0 && dups.length === 0 && Math.abs(sumR - sumP) <= 20;

    var h = '';
    h += '<h2 style="margin-top:0">チェック結果 <span class="badge ' + (okAll ? 'ok' : 'ng') + '">' + (okAll ? '問題なし' : '要確認あり') + '</span></h2>';
    h += '<div class="totals">' +
      '<div class="tot"><div class="k">名簿</div><div class="v">' + R.length + '人</div><div class="s">' + yen(sumR) + '</div></div>' +
      '<div class="tot"><div class="k">請求書</div><div class="v">' + nUniqueP + '人' + (nUniqueP !== P.length ? ' <span class="ng">(重複込み ' + P.length + ')</span>' : '') + '</div><div class="s">' + yen(sumP) + '</div></div>' +
      Object.keys(byKind).map(function (k) { return '<div class="tot"><div class="k">' + k + '</div><div class="v">' + byKind[k].people + '人</div><div class="s">' + byKind[k].files + 'ファイル / ' + yen(byKind[k].amount) + '</div></div>'; }).join('') +
      '<div class="tot ' + (R.length === nUniqueP && Math.abs(sumR - sumP) <= 20 ? 'ok' : 'ng') + '"><div class="k">差(請求書 − 名簿)</div><div class="v">' + (nUniqueP - R.length > 0 ? '+' : '') + (nUniqueP - R.length) + '人</div><div class="s">' + (sumP - sumR >= 0 ? '+' : '−') + yen(Math.abs(sumP - sumR)).slice(1) + '円</div></div>' +
      '</div>';

    function tbl(head, rows) { return rows.length ? '<table><tr>' + head.map(function (x) { return '<th' + (/^¥|金額|No/.test(x) ? ' class="n"' : '') + '>' + x + '</th>'; }).join('') + '</tr>' + rows.join('') + '</table>' : '<p class="small">なし</p>'; }

    h += '<h2>名簿にいるが請求書がない人 <span class="badge ' + (missing.length ? 'ng' : 'ok') + '">' + missing.length + '人</span></h2>';
    h += tbl(['No', '名簿の名前', '名簿の金額'], missing.map(function (r) { return '<tr class="ng"><td class="n">' + esc(r.no) + '</td><td>' + esc(r.name) + '</td><td class="n">' + yen(r.amount) + '</td></tr>'; }));

    h += '<h2>請求書にいるが名簿にない人 <span class="badge ' + (extra.length ? 'warn' : 'ok') + '">' + extra.length + '人</span></h2>';
    h += tbl(['名前', '区分', 'ファイル', '請求書の金額'], extra.map(function (p) { return '<tr class="warn"><td>' + esc(p.name) + '</td><td>' + p.kind + '</td><td class="small">' + esc(p.file) + '</td><td class="n">' + yen(p.amount) + '</td></tr>'; }));

    h += '<h2>表記ゆれで突き合わせた人（同じ人か確認） <span class="badge ' + (fuzzy.length ? 'warn' : 'ok') + '">' + fuzzy.length + '組</span></h2>';
    h += tbl(['名簿の名前', '請求書の名前', '区分', '名簿の金額', '請求書の金額'], fuzzy.map(function (o) { return '<tr class="warn"><td>' + esc(o.r.name) + '</td><td>' + esc(o.p.name) + '</td><td>' + o.p.kind + '</td><td class="n">' + yen(o.r.amount) + '</td><td class="n">' + yen(o.p.amount) + '</td></tr>'; }));

    h += '<h2>金額が違う人 <span class="badge ' + (amtDiff.length ? 'ng' : 'ok') + '">' + amtDiff.length + '人</span></h2>';
    h += tbl(['名前', '名簿の金額', '請求書の金額', '差', 'ファイル'], amtDiff.map(function (o) { return '<tr class="ng"><td>' + esc(o.r.name) + '</td><td class="n">' + yen(o.r.amount) + '</td><td class="n">' + yen(o.p.amount) + '</td><td class="n">' + (o.p.amount - o.r.amount > 0 ? '+' : '−') + yen(Math.abs(o.p.amount - o.r.amount)).slice(1) + '</td><td class="small">' + esc(o.p.file) + '</td></tr>'; }));
    if (amtUnknown.length) h += '<p class="small warn">※ ' + amtUnknown.length + '人は明細書シートから金額を読み取れませんでした: ' + amtUnknown.map(function (o) { return esc(o.p.name); }).join('、') + '</p>';

    h += '<h2>請求書の中で重複している人 <span class="badge ' + (dups.length ? 'ng' : 'ok') + '">' + dups.length + '組</span></h2>';
    h += tbl(['名前', '1つ目のファイル', '2つ目のファイル'], dups.map(function (d) { return '<tr class="ng"><td>' + esc(d.b.name) + '</td><td class="small">' + esc(d.a.file) + '</td><td class="small">' + esc(d.b.file) + '</td></tr>'; }));

    // ファイルごと: 明細書の合計 と 請求書シートの集計 の一致
    var fileRows = invoices.map(function (iv) {
      var ps = iv.persons.reduce(function (a, x) { return a + (x.amount || 0); }, 0);
      var ok = Math.abs(ps - iv.summary.amount) <= 20 && iv.persons.length === iv.summary.people;
      return '<tr' + (ok ? '' : ' class="warn"') + '><td class="small">' + esc(iv.file) + '</td><td>' + iv.kind + '</td><td class="n">' + iv.persons.length + '人</td><td class="n">' + yen(ps) + '</td><td class="n">' + iv.summary.people + '件 / ' + yen(iv.summary.amount) + '</td><td class="c">' + (ok ? '<span class="ok">✓</span>' : '<span class="warn">差あり</span>') + '</td></tr>';
    });
    h += '<details><summary>ファイルごとの確認（明細書の合計と請求書シートの集計）</summary>' + tbl(['ファイル', '区分', '明細書', '明細書の金額計', '請求書シートの集計', ''], fileRows) + '</details>';

    // 全員一覧
    var all = rowsOut.map(function (o) {
      var st = !o.p ? '<span class="ng">請求書なし</span>' : (o.how === '表記ゆれ' ? '<span class="warn">表記ゆれ</span>' : (o.r.amount != null && o.p.amount != null && Math.abs(o.r.amount - o.p.amount) > 20 ? '<span class="ng">金額違い</span>' : '<span class="ok">✓</span>'));
      return '<tr' + (!o.p ? ' class="ng"' : '') + '><td class="n">' + esc(o.r.no) + '</td><td>' + esc(o.r.name) + '</td><td class="n">' + yen(o.r.amount) + '</td><td>' + (o.p ? esc(o.p.name) : '') + '</td><td>' + (o.p ? o.p.kind : '') + '</td><td class="n">' + (o.p ? yen(o.p.amount) : '') + '</td><td class="c">' + st + '</td></tr>';
    });
    h += '<details open><summary>名簿の全員（' + R.length + '人）</summary>' + tbl(['No', '名簿の名前', '名簿の金額', '請求書の名前', '区分', '請求書の金額', '状態'], all) + '</details>';
    h += '<p class="noprint" style="margin-top:14px"><button class="btn2" onclick="window.print()">印刷 / PDF保存</button><button class="btn2" id="copy">結果をテキストでコピー</button></p>';

    var res = $('result'); res.innerHTML = h; res.style.display = 'block'; res.scrollIntoView({ behavior: 'smooth', block: 'start' });
    var txt = ['【請求書 名簿チェック】 名簿 ' + R.length + '人 ' + yen(sumR) + ' / 請求書 ' + nUniqueP + '人 ' + yen(sumP),
      '■名簿にいるが請求書がない: ' + (missing.map(function (r) { return r.name + '(' + yen(r.amount) + ')'; }).join('、') || 'なし'),
      '■請求書にいるが名簿にない: ' + (extra.map(function (p) { return p.name + '(' + p.kind + ')'; }).join('、') || 'なし'),
      '■表記ゆれ: ' + (fuzzy.map(function (o) { return o.r.name + '⇔' + o.p.name; }).join('、') || 'なし'),
      '■金額が違う: ' + (amtDiff.map(function (o) { return o.r.name + ' 名簿' + yen(o.r.amount) + '/請求書' + yen(o.p.amount); }).join('、') || 'なし'),
      '■重複: ' + (dups.map(function (d) { return d.b.name; }).join('、') || 'なし')].join('\n');
    $('copy').addEventListener('click', function () { navigator.clipboard.writeText(txt).then(function () { $('copy').textContent = 'コピーしました'; }); });
  }
  $('run').addEventListener('click', function () { try { check(); } catch (e) { $('msg').innerHTML = '<span class="ng">' + esc(e.message || e) + '</span>'; } });
})();
</script>
</body>
</html>
