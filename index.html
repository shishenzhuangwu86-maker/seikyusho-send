<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>請求書 まとめ送信</title>
<style>
  :root { --bg:#f4f6f9; --text:#1f2937; --muted:#6b7280; --accent:#2563eb; --accent2:#1d4ed8; --line:#e5e7eb; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:48px 20px; text-align:center; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); font-size:14px; line-height:1.7; margin:0 0 20px; }
  .btn { display:block; padding:16px; font-size:18px; font-weight:700; border-radius:12px; background:var(--accent); color:#fff; text-decoration:none; }
  .btn:hover { background:var(--accent2); }
  .small { font-size:12px; margin-top:16px; }
</style>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycby51fGIDUa2XfrInk4ETUdgcQ-ABeFTn3RX5q34AJe_eNCyDRI5vdin8PDgQo1ly6M-lg/exec';
  // このページは短い入口URL。開いたらすぐ送信画面へ移動する(戻るで戻れるように replace は使わない)
  setTimeout(function () { location.href = APP; }, 400);
</script>
</head>
<body>
  <div class="wrap">
    <h1>請求書 まとめ送信</h1>
    <p>送信画面を開いています…<br>自動で切り替わらない場合は下のボタンを押してください。</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycby51fGIDUa2XfrInk4ETUdgcQ-ABeFTn3RX5q34AJe_eNCyDRI5vdin8PDgQo1ly6M-lg/exec">送信画面を開く</a>
    <p class="small">Googleアカウントでのログインが必要です。画面上部に「このアプリケーションは Google Apps Script のユーザーによって作成されたものです」と出ますが正常です。</p>
  </div>
</body>
</html>
